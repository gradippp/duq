name: Release (Artifacts)

on:
  push:
    tags: [ "v*.*.*", "*.*.*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.get.outputs.full }}
      strict: ${{ steps.get.outputs.strict }}
    steps:
      - name: Get Version from Git Tag
        id: get
        shell: bash
        run: |
          FULL_VERSION="0.0.0"
          STRICT_VERSION="0.0.0"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            FULL_VERSION=${GITHUB_REF#refs/tags/}
            FULL_VERSION=${FULL_VERSION#v}
            STRICT_VERSION=$(echo "$FULL_VERSION" | sed 's/-.*//')
          fi
          echo "full=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "strict=$STRICT_VERSION" >> "$GITHUB_OUTPUT"

  release:
    name: Build & Upload on ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libfreetype6-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STANDALONE=OFF -DPLUGIN_VERSION="${{ needs.version.outputs.strict }}" -DFULL_PLUGIN_VERSION="${{ needs.version.outputs.full }}"

    - name: Build Plugin
      run: cmake --build build --config Release --parallel 4

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Duq-VST3-${{ runner.os }}-${{ needs.version.outputs.full }}
        path: build/Duq_artefacts/Release/VST3/

    - name: Upload AU Artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: Duq-AU-${{ runner.os }}-${{ needs.version.outputs.full }}
        path: build/Duq_artefacts/Release/AU/

  manual:
    name: Build PDF Manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Manual
        uses: xu-cheng/texlive-action@v2
        with:
          run: |
            apk add --no-cache nodejs npm
            npm install -g pnpm
            cd docs
            pnpm install
            node build.js

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duq-User-Manual
          path: docs/build/main.pdf

  publish:
    name: Publish Release
    needs: [version, release, manual]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Artifacts
        run: |
          # Copy INSTALLATION.md to factory content folder before zipping
          mkdir -p build/FactoryContent
          cp res/INSTALLATION.md build/FactoryContent/
          
          # Zip the Factory Content separately
          cd build/FactoryContent
          zip -r "../../Duq-Factory-Content-${{ needs.version.outputs.full }}.zip" .
          cd ../..

          # Zip the Plugin Artifacts
          cd artifacts
          for dir in */; do
            dir=${dir%/}
            cd "$dir"
            zip -r "../../${dir}.zip" .
            cd ..
          done
          cd ..
          ls -l *.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-test') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
