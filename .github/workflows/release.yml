name: Release (Artifacts)

on:
  push:
    tags: [ "v*.*.*", "*.*.*" ]
  workflow_dispatch:

jobs:
  release:
    name: Build & Upload on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get Version from Git Tag
      shell: bash
      run: |
        FULL_VERSION="0.0.0"
        STRICT_VERSION="0.0.0"
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          FULL_VERSION=${GITHUB_REF#refs/tags/}
          FULL_VERSION=${FULL_VERSION#v}
          STRICT_VERSION=$(echo "$FULL_VERSION" | sed 's/-.*//')
        fi
        echo "FULL_PLUGIN_VERSION=$FULL_VERSION" >> $GITHUB_ENV
        echo "STRICT_PLUGIN_VERSION=$STRICT_VERSION" >> $GITHUB_ENV

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libfreetype6-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STANDALONE=OFF -DPLUGIN_VERSION="${{ env.STRICT_PLUGIN_VERSION }}" -DFULL_PLUGIN_VERSION="${{ env.FULL_PLUGIN_VERSION }}"

    - name: Build Plugin
      run: cmake --build build --config Release --parallel 4

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Duq-VST3-${{ runner.os }}-${{ env.FULL_PLUGIN_VERSION }}
        path: build/Duq_artefacts/Release/VST3/

    - name: Upload AU Artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: Duq-AU-${{ runner.os }}-${{ env.FULL_PLUGIN_VERSION }}
        path: build/Duq_artefacts/Release/AU/

  publish:
    name: Publish Release
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Artifacts
        run: |
          # Copy INSTALLATION.md to factory content folder before zipping
          mkdir -p build/FactoryContent
          cp res/INSTALLATION.md build/FactoryContent/
          
          # Zip the Factory Content separately
          cd build/FactoryContent
          zip -r "../../Duq-Factory-Content-${{ env.FULL_PLUGIN_VERSION }}.zip" .
          cd ../..

          # Zip the Plugin Artifacts
          cd artifacts
          for dir in */; do
            dir=${dir%/}
            cd "$dir"
            zip -r "../../${dir}.zip" .
            cd ..
          done
          cd ..
          ls -l *.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-test') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
