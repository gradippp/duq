name: Build Plugin

on:
  push:
    branches: [ "main", "dev", "feat/ci-test" ]
  pull_request:
    branches: [ "main", "dev", "feat/ci-test" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libfreetype6-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STANDALONE=OFF

    - name: Build Plugin
      run: cmake --build build --config Release --parallel 4

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Duq-VST3-${{ runner.os }}
        path: build/Duq_artefacts/Release/VST3/

    - name: Upload AU Artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: Duq-AU-${{ runner.os }}
        path: build/Duq_artefacts/Release/AU/
